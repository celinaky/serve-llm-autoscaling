name: qwen-step-rate-autoscaling

deployment:
  application_name: ttft-benchmark
  model_id: Qwen/Qwen3-0.6B-FP8
  model_source: Qwen/Qwen3-0.6B-FP8
  route_prefix: /
  direct_streaming: false
  engine:
    tensor_parallel_size: 1
    max_model_len: 10000
    gpu_memory_utilization: 0.95
    max_num_seqs: 128
    max_num_batched_tokens: 16384
    enable_prefix_caching: false
    kv_cache_dtype: fp8
  autoscaling:
    min_replicas: 1
    initial_replicas: 1
    max_replicas: 4
    target_ongoing_requests: 4
    upscale_delay_s: 30
    # Short enough for downscaling to show during the drain period.
    downscale_delay_s: 120
  max_ongoing_requests: 8192

benchmark:
  generator: aiperf
  mode: request_rate_series
  duration_s: 300
  grace_period_s: 120
  arrival_pattern: poisson
  # AIPerf interpolates linearly between points; the 60/60.1 and 180/180.1
  # pairs approximate steps from 8 req/s to 18 req/s (above the ~14-16 req/s
  # single-replica ceiling) and back.
  rate_series:
    - time_s: 0
      qps: 8
    - time_s: 60
      qps: 8
    - time_s: 60.1
      qps: 18
    - time_s: 180
      qps: 18
    - time_s: 180.1
      qps: 8
    - time_s: 300
      qps: 8
  warmup:
    enabled: true
    duration_s: 30
  workload:
    type: synthetic
    input_tokens: 8000
    output_tokens: 50
    seed: 42
    ignore_eos: true
  streaming: true
  fail_fast: true

runtime:
  endpoint_url: http://127.0.0.1:8000
  readiness_timeout_s: 1200
  keep_deployment: false
  results_dir: runs

analysis:
  window_s: 5
  tail_window_s: 30
  status_interval_s: 1
  metrics_interval_s: 2
  generate_plots: true
