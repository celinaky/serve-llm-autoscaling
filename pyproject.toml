[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serve-llm-autoscaling"
version = "0.1.0"
description = "Experiment harness for Ray Serve LLM autoscaling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiperf==0.11.0",
    "httpx>=0.27,<1",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
autoscale-harness = "serve_llm_autoscaling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

